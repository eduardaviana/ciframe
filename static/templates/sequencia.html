<div class="container-fluid">
  <div class="sequencia-toast" ng-if="Sequencia.mensagemSucesso" role="status" aria-live="polite">
    <div class="alert alert-success">{{Sequencia.mensagemSucesso}}</div>
  </div>
  <div class="row">
    <div class="col-sm-6 col-md-4 viewWindow-panel viewWindow-panel-C">
      <div class="viewWindow-panel-container">
        <h4 class="text-center">Aponte uma sequencia de acordes</h4>
        <div class="text-center cadastro-sequencia-actions">
          <button class="btn btn-default" ng-click="Sequencia.abrirCadastro()">Cadastrar sequência</button>
        </div>
        <div class="acordes-container" ng-repeat='sequencia in Sequencia.sequenciasFamosas' ng-click="Sequencia.pesquisarPorSequencia(sequencia)">
          <df-hex acorde="{{acordeon.acorde}}" acorde-color="{{acordeon.cor}}" acorde-checked="Sequencia.temAcorde(acordeon)" ng-repeat="acordeon in sequencia.acordes"></df-hex>
        </div>
        <br style="clear: both;">
        <div class="alert alert-danger" ng-if="Sequencia.erroCatalogo" role="alert">{{Sequencia.erroCatalogo}}</div>
        <button class="search-results-count" ng-if="Sequencia.showSearchResultsCount" ng-click="Sequencia.goToResults()">
          <span class="glyphicon glyphicon-triangle-bottom bounce animated infinite"></span>
          <br>
          Encontrei essas músicas
        </button>
      </div>
    </div>
    <div id="results" class="col-sm-6 col-md-8 viewWindow-panel viewWindow-panel-D">
      <div class="viewWindow-panel-container">
        <div ng-show="Sequencia.minhaSequencia.acordes.length">
          <h4>{{Sequencia.esfigeSpeech}}</h4>
          <div class="row">
            <div class="col-md-3">
              <div class="form-group">
                <select
                  class="form-control form-control-inverse input-lg"
                  ng-options="genero for genero in Sequencia.generos | orderBy:'genero'"
                  ng-model="Sequencia.meuGenero"
                  ng-change="Sequencia.pesquisarPorSequencia()">
                  <option value="">-- Gênero --</option>
                </select>
              </div>
            </div>
            <div class="col-md-9">
              <df-hex acorde="{{acordeon.acorde}}" acorde-color="{{acordeon.cor}}" ng-repeat="acordeon in Sequencia.minhaSequencia.acordes" ng-click="Sequencia.limparPesquisa()"></df-hex>
              <br style="clear: both;"><br>
            </div>
          </div>
        </div>

        <div class="row row-in">
          <div class="col-sm-6 col-lg-4"
            ng-repeat="music in Sequencia.musics | orderBy:'-popularidade'"
            ng-hide="music.diferenca.length">

              <div class="music-card" ng-click="Sequencia.goToLirics(music)">
                <div class="row row-in">
                  <div class="col-xs-2 text-center">
                    <div class="music-lock"><span class="icon-lg icon-lock-open"></span></div>
                  </div>
                  <div class="col-xs-10">
                    <p class="music-title">{{music.nome_musica}}</p>
                    <p class="music-artist">{{music.nome_artista}}</p>
                    <p class="music-gender"><span class="label label-default">{{music.genero}}</span></p>
                  </div>
                </div>
              </div>

          </div>
        </div>

    </div>
  </div>
</div>

<script type="text/ng-template" id="sequenciaCadastroModal.html">
  <div class="modal-header">
    <button type="button" class="close" ng-click="Cadastro.cancelar()" aria-label="Fechar">
      <span aria-hidden="true">&times;</span>
    </button>
    <h3 class="modal-title">Cadastrar sequência</h3>
  </div>
  <div class="modal-body">
    <p>Escolha os acordes na ordem da sequência.</p>

    <div class="sequencia-cadastro-grade">
      <div class="acordes-container" ng-repeat='acordesCollection in Cadastro.acordes'>
        <df-hex acorde="{{acordeon.acorde}}" acorde-color="{{acordeon.cor}}" acorde-checked="Cadastro.temAcorde(acordeon)" ng-repeat="acordeon in acordesCollection" ng-click="Cadastro.adicionarAcorde(acordeon)"></df-hex>
      </div>
    </div>

    <h4>Sequência montada</h4>
    <div class="sequencia-selecionada" ng-if="Cadastro.minhaSequencia.length">
      <div class="acordes-container">
        <df-hex acorde="{{acordeon.acorde}}" acorde-color="{{acordeon.cor}}" ng-repeat="acordeon in Cadastro.minhaSequencia track by $index" ng-click="Cadastro.removerAcorde($index)" title="Clique para remover este acorde"></df-hex>
      </div>
    </div>
    <div class="sequencia-mensagens">
      <p ng-if="!Cadastro.minhaSequencia.length">Nenhum acorde escolhido.</p>
      <p>{{Cadastro.minhaSequencia.length}} acorde(s) selecionado(s).</p>
      <p class="text-danger" ng-if="Cadastro.minhaSequencia.length < 2">Escolha pelo menos 2 acordes.</p>
      <div class="alert alert-danger" ng-if="Cadastro.erro">{{Cadastro.erro}}</div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-cancelar" ng-click="Cadastro.cancelar()">Cancelar</button>
    <button class="btn btn-cadastrar" ng-click="Cadastro.cadastrar()" ng-disabled="Cadastro.minhaSequencia.length < 2">Cadastrar</button>
  </div>
</script>
